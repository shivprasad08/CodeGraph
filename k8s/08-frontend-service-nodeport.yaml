apiVersion: v1
kind: Service
metadata:
  name: codegraph-frontend-nodeport
  namespace: codegraph
spec:
  type: NodePort
  selector:
    app: codegraph-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
# This bare k3s cluster has no cloud load balancer integration. NodePort lets
# external traffic reach the service at http://<EC2-public-ip>:30080.

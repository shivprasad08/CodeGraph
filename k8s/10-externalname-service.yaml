apiVersion: v1
kind: Service
metadata:
  name: external-github-api
  namespace: codegraph
spec:
  type: ExternalName
  externalName: api.github.com
# ExternalName creates a DNS alias so pods can use
# external-github-api.codegraph.svc.cluster.local instead of the real hostname.
# This abstracts an external dependency behind a stable internal name. The
# application does not use this Service; its GitHub API calls go out directly.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: codegraph-cache-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: codegraph-hostpath
  hostPath:
    path: /mnt/codegraph-cache
    type: DirectoryOrCreate
# hostPath is suitable for this single-node k3s demo. A real multi-node
# cluster should use a proper StorageClass instead.

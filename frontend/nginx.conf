server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable proxy buffering for SSE support (if this server were proxying, though here it just serves static files)
    # The actual proxying to the backend isn't handled by Nginx here (since the browser talks directly to the backend URL via VITE_API_URL).
    # But just in case any downstream proxying occurs or headers need to be passed:
    proxy_buffering off;
}

services:
  backend:
    build:
      context: ./backend
    container_name: codegraph-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://${PUBLIC_IP}:8000"
    container_name: codegraph-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped